services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gochat}
      POSTGRES_USER: ${POSTGRES_USER:-gochat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gochat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gochat} -d ${POSTGRES_DB:-gochat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://gochat:gochat@postgres:5432/gochat?sslmode=disable}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-32}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_ENV: ${APP_ENV:-development}
      WS_TICKET_TTL: ${WS_TICKET_TTL:-30s}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      PORT: ${BACKEND_PORT:-8080}
      LOGIN_RATE_LIMIT_RPM: ${LOGIN_RATE_LIMIT_RPM:-5}
      REGISTER_RATE_LIMIT_RPM: ${REGISTER_RATE_LIMIT_RPM:-10}
      REFRESH_RATE_LIMIT_RPM: ${REFRESH_RATE_LIMIT_RPM:-30}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws/connect}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  pgdata:
