# Overlay for HTTP load tests with k6.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.load.yml run --rm k6 run /scripts/http-flow.js -e SCENARIO=load_100

services:
  backend:
    environment:
      LOGIN_RATE_LIMIT_RPM: "0"

  k6:
    image: grafana/k6:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./loadtests:/scripts:ro
    environment:
      BASE_URL: http://backend:8080/api/v1
    profiles:
      - loadtest
    entrypoint: ["k6"]

  wsbots:
    build:
      context: ./loadtests/wsbots
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080/api/v1
      WS_URL: ws://backend:8080/ws/connect
      BOTS: "100"
      INTERVAL: 1s
      DURATION: 3m
      RAMP: 30s
    profiles:
      - loadtest

  simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile.simulator
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080/api/v1
      WS_URL: ws://backend:8080/ws/connect
      SIM_USERS: "100"
      SIM_CONVERSATIONS: "20"
      SIM_MESSAGES_PER_SECOND: "50"
      SIM_DURATION: 5m
      SIM_RAMP: 30s
    profiles:
      - loadtest
